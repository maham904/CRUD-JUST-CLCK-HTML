<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View and edit your profile at E-Book Library. Update your information and manage your account.">
    <title>E-Book Library | Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">E-Book Library</div>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="browsebooks.html">Browse Books</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="logout.html" class="active">Log out</a></li>
            </ul>
        </nav>
    </header>

    <!-- Profile Section -->
    <section class="profile-section">
        <div class="profile-container">
            <div class="profile-details">
                <h1>Welcome</h1>
                <form action="/update-profile" method="POST" class="profile-form">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password"  required>
                    </div>
                    <div class="form-group">
                        <button type="submit" class="submit-button">Update Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

</body>
