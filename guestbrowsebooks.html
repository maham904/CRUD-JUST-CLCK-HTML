<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse and explore a wide range of books available for free download at E-Book Library.">
    <title>E-Book Library | Browse Books</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">E-Book Library</div>
        <nav>
            <ul>
                <li><a href="guesthome.html">Home</a></li>
                <li><a href="guestbrowsebooks.html">Browse Books</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Search and Filter Section -->
    <section class="search-filter">
        <h1>Browse Books</h1>
        <form action="/search" method="GET" class="search-bar">
            <input type="text" name="query" placeholder="Search books...">
            <button type="submit">Search</button>
        </form>
        <div class="filter-options">
            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="">All</option>
                <option value="self-help">Self-Help</option>
                <option value="Science">Science</option>
                <option value="Maths">Maths</option>
                <option value="Programming">Programming</option>
            </select>
        </div>
    </section>

    <!-- Book Listings Section -->
    <section class="book-listings">
        <div class="book-list">
            <!-- Sample Book Card -->
            <div class="book">
                <a href="book1-details.html">
                    <img src="48lawsofpower.jpg" alt="48 Laws of Power">
                    <h3>48 Laws of Power</h3>
                </a>
            </div>
            <div class="book">
                <a href="book2-details.html">
                    <img src="allquiteonwesternfront.jpg" alt="All Quiet on the Western Front">
                    <h3>All Quiet on the Western Front</h3>
                </a>
            </div>
            <div class="book">
                <a href="book3-details.html">
                    <img src="thinkandgrowrich.jpg" alt="Think and Grow Rich">
                    <h3>Think and Grow Rich</h3>
                </a>
            </div>
            <!-- More books can be added here -->
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 E-Book Library. All Rights Reserved.</p>
        <div class="social-links">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </div>
    </footer>
</body>
</html>
