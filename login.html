<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to your E-Book Library account to access your favorite books.">
    <title>E-Book Library | Login</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Header Section -->
    <header>
        <div class="logo">Just Click</div>
        <nav>
            <ul>
                <li><a href="login.html" class="active">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
            </ul>
        </nav>
    </header>

    <!-- Login Form Section -->
    <section class="auth-form">
        <h2>Login to Your Account</h2>
        <form id="login-form" action="/login" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            <button type="submit" class="submit-button">Login</button>
        </form>
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </section>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>

    <br>
<br>
<br>

<br>
    <!-- Footer -->
    <footer>
        <p>&copy; 2025 E-Book Library. All Rights Reserved.</p>
        <div class="social-links">
            <a href="#">Facebook</a>
            <a href="#">Twitter</a>
            <a href="#">Instagram</a>
        </div>
    </footer>

    <!-- JavaScript for Form Submission -->
    <script>
        document.getElementById('login-form').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the form from submitting the traditional way

            // Simulate a successful login (you can replace this with actual backend logic)
            alert('Login successful! Redirecting to home page...');

            // Redirect to the home page after 2 seconds
            setTimeout(function() {
                window.location.href = 'home.html';
            }, 2000);
        });
    </script>
</body>
</html>
